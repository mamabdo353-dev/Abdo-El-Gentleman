<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عبده الجنتل</title>
  <style>
    body {
      background: url('photo.png') no-repeat center top fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .box {
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      color: #fff;
    }
    h1 { color: #ffd700; margin: 0 0 15px; font-size: 30px; }
    a {
      display: block;
      background: #ffd700;
      color: #000;
      padding: 15px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>عبده الجنتل</h1>
    <a href="https://github.io">⚡ تفعيل GoldHEN</a>
  </div>
</body>
</html>
