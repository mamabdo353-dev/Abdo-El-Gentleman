<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abdo El Gentleman - PS4 Host</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-image: url('photo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    .overlay {
      background: rgba(0, 0, 0, 0.65);
      padding: 30px 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      border: 2px solid #00a8ff;
      box-shadow: 0 0 20px rgba(0, 168, 255, 0.5);
    }
    h1 {
      font-size: 26px;
      margin-bottom: 8px;
      color: #00d2ff;
    }
    p {
      font-size: 15px;
      margin-bottom: 25px;
      color: #dddddd;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(45deg, #005bea, #00c6fb);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      transform: scale(1.03);
      background: linear-gradient(45deg, #00c6fb, #005bea);
    }
    .btn-gold {
      background: linear-gradient(45deg, #d4af37, #f9d423);
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>عبدو الرجل النبيل</h1>
    <p>PS4 Custom Host - 12.02</p>

    <button class="btn btn-gold" onclick="alert('لإصدار 12.02: يرجى تشغيل أسطوانة التعديل أو الفلاشة أولاً لتفعيل GoldHEN')">
      تفعيل GoldHEN
    </button>

    <button class="btn" onclick="alert('تم تفعيل وضع قفل التحديثات')">
      قفل تحديثات النظام
    </button>

    <button class="btn" onclick="alert('متصفح عبدو الرجل النبيل جاهز')">
      حول الصفحة
    </button>
  </div>

</body>
</html>
